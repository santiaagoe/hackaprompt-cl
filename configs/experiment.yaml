# Parámetros del experimento. Cambiar aquí, nunca escritos a mano en el código.
seed: 13

dataset:
  hf_name: hackaprompt/hackaprompt-dataset
  subset: submission_data        # columna `dataset`
  only_correct: true
  levels: [1, 2, 3, 4, 5, 6, 7, 8]  # 9 y 10 excluidos (restricciones de caracteres)
  per_level: 125                 # 8 x 125 = 1.000
  pilot_per_level: 10            # piloto de 80

translation:
  keep_untranslated: ["I have been PWNED"]
  neutral_model: Helsinki-NLP/opus-mt-en-es   # opción B, paso 1
  # api_model: completar si se usa la opción A

victim:
  backend: ollama
  model: llama3.1:8b-instruct-q4_K_M   # anotar el tag exacto usado
  temperature: 0
  max_tokens: 64

conditions: [en, es_neutro, es_cl]
