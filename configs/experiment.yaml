# Parámetros del experimento. Cambiar aquí, nunca escritos a mano en el código.
seed: 13

dataset:
  hf_name: hackaprompt/hackaprompt-dataset
  subset: submission_data        # columna `dataset`
  only_correct: true
  levels: [1, 2, 3, 4, 5, 6, 7, 8]  # 9 y 10 excluidos (restricciones de caracteres)
  per_level: 125                 # 8 x 125 = 1.000 (evaluación)
  pilot_per_level: 10            # piloto de 80
  train_per_level: 100           # 800 para entrenar el traductor propio (C)
  max_token_count: null          # ej. 1000 para excluir ataques de "context overflow" muy largos
  # Las tres muestras son disjuntas: un prompt nunca está en más de una.

translation:
  keep_untranslated: ["I have been PWNED"]
  neutral_model: Helsinki-NLP/opus-mt-en-es   # opción B, paso 1
  # api_model: completar si se usa la opción A

victim:
  # transformers: Colab/Kaggle con GPU (Llama en 4 bits). ollama: local (Mac con chip M o GPU).
  backend: transformers
  model: meta-llama/Llama-3.1-8B-Instruct   # modelo con acceso restringido: pedirlo en Hugging Face
  ollama_model: llama3.1:8b-instruct-q4_K_M
  temperature: 0          # decodificación greedy, determinista
  max_tokens: 64          # largo máximo de la respuesta
  batch_size: 8

conditions: [en, es_neutro, es_cl]
